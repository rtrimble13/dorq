kind = "statements"

[statements]
identity_share = 0.005
tie_floor = 1e6
quarter_spacing = [56, 126]
coverage_floor = "1998-01-01"
nonnegative = ["revenue", "total_assets"]
never_absent = ["revenue"]
bounds = ["total_current_assets <= total_assets"]
cash_tie = ["cash_and_equivalents", "net_change_in_cash"]
null_is_zero = ["fx_effect_on_cash"]
restricted_cash_from = "2018-01-01"
restricted_cash_share = 0.1

[statements.identities]
balance_sheet = "total_assets = total_liabilities + total_equity_parent"
"odd name" = "-a + b = c - d"

[statements.explained_by]
balance_sheet = ["net_income_noncontrolling"]

[statements.priors]
bad_value = 0.001
unit_error = 0.0002
sign_error = 0.0002
flow_scale = 0.08
stock_scale = 0.05
prior_weight = 6

[profiles.statements]
match = { kind = "statements" }
ignore = ["DQ104"]
