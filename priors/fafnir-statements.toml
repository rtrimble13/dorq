# dorq for fafnir's statements: SF1's fundamentals in core.income_statement,
# core.balance_sheet and core.cash_flow_statement (plan M9, doc/statements.md).
#
# fafnir runs `dorq check --format fafnir` on its export of every current version
# with this file, and passes fafnir's taxonomy as --items (ref.statement_line_item):
#
#   dorq statements.csv --kind statements --items items.csv \
#        --config priors/fafnir-statements.toml --format fafnir
#
# Every item named here must be one --items lists, or the run stops with exit
# status 2.

[fafnir]
# A finding on no one statement; each statement's own go to its table
# ([fafnir.tables], whose defaults are fafnir's three).
table_name = "core.income_statement"

[statements]
# fafnir's tolerances (src/fafnir/dq/checks.py): an identity holds within the larger
# of 0.5% of its largest term and 1M of the reporting currency; the change in cash
# within 2% of the balance, or 10% from 2018 (ASU 2016-18), quarters 56 to 126 days
# apart and years 300 to 430. These are dorq's defaults, written out.
identity_share = 0.005
tie_floor = 1e6
cash_tie_share = 0.02
restricted_cash_from = "2018-01-01"
restricted_cash_share = 0.10
quarter_spacing = [56, 126]
year_spacing = [300, 430]
coverage_floor = "1998-01-01"
# DQ904: the balance sheet's cash, and the cash flow's change in it.
cash_tie = ["cash_and_equivalents", "net_change_in_cash"]
# An identity reads these as 0 where NULL, as fafnir's cash_flow_tie does
# (coalesce): most companies report no exchange-rate effect.
null_is_zero = ["fx_effect_on_cash"]
# fafnir's NEVER_ZERO: items a reporting company always has.
never_absent = [
  "revenue",
  "net_income",
  "weighted_average_shares",
  "total_assets",
  "total_liabilities",
  "total_equity_parent",
  "cash_and_equivalents",
  "shares_outstanding",
  "net_cash_operating",
]
# DQ902: what can never be negative. fafnir's NEVER_NEGATIVE
# (src/fafnir/dq/checks.py), which fundamentals_negative_impossible judges.
nonnegative = [
  "revenue",
  "weighted_average_shares",
  "weighted_average_shares_diluted",
  "total_assets",
  "shares_outstanding",
]
# DQ902: a component that can never exceed the total it is part of.
bounds = [
  "total_current_assets <= total_assets",
  "cash_and_equivalents <= total_assets",
  "goodwill_and_intangibles <= total_assets",
  "total_current_liabilities <= total_liabilities",
]

# DQ903: SF1's identities (plan section 4.2), less the three SF1 computes, which held
# on every row of a 400-ticker sample (scripts/fafnir-identity-pass-rates.sql
# measures them on fafnir's current versions; doc/checks/DQ903.md):
#   gross_profit = revenue - cost_of_revenue
#   operating_income = gross_profit - operating_expenses
#   ebit = income_before_tax + interest_expense
[statements.identities]
balance_sheet = "total_assets = total_liabilities + total_equity_parent"
assets_split = "total_assets = total_current_assets + total_noncurrent_assets"
liabilities_split = "total_liabilities = total_current_liabilities + total_noncurrent_liabilities"
debt_split = "total_debt = debt_current + debt_noncurrent"
investments_split = "investments_total = investments_current + investments_noncurrent"
net_income = "net_income = consolidated_income - net_income_noncontrolling"
net_income_common = "net_income_common = net_income - preferred_dividends"
cash_flow = "net_change_in_cash = net_cash_operating + net_cash_investing + net_cash_financing + fx_effect_on_cash"

# DQ903: noncontrolling interests, which SF1 leaves out of both liabilities and the
# parent's equity, explain the balance sheet's gap where the period reports their
# income.
[statements.explained_by]
balance_sheet = ["net_income_noncontrolling"]
