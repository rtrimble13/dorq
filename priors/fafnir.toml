# dorq for fafnir's warehouse (rtrimble13/fafnir, doc/dorq.md there; plan DR-0704).
#
# fafnir runs `dorq check --format fafnir` with this file as [dq] dorq_config, and
# passes the context itself: --calendar-file (ref.trading_calendar for the venue),
# --actions (core.corporate_action), --meta (core.security: asset_type, exchange,
# nav_priced) and --as-of (the market's latest open session).
#
# This is the starting point, not the fit. The priors below are dorq's defaults.
# DR-0704 replaces them with a calibration on fafnir's own labels. Give calibrate
# the context check gets (it has taken these options since 0.6.0), and the bars
# and actions as they stood before the repairs the labels record:
#
#   fafnir dq export-labels --out labels.jsonl --restore before.csv \
#        --restore-actions before-actions.csv
#   dorq calibrate bars.csv --labels labels.jsonl --config priors/fafnir.toml \
#        --calendar-file calendar.csv --calendar-exchange NASDAQ \
#        --actions actions.csv --meta meta.csv \
#        --restore before.csv --restore-actions before-actions.csv \
#        --holdout 0.3 --out fafnir-calibration.toml
#
# and then this file includes it (uncomment below). Keep the labels and the fit
# under version control together; the [calibration] version names the pair.

# include = "fafnir-calibration.toml"

[calendar]
name = "XNYS"          # outside the span of the calendar file fafnir passes

[fafnir]
table_name = "core.daily_price"

# DQ107 and DQ501 on thin series (doc/checks/DQ107.md). fafnir's universe holds
# thousands of small ETFs that trade a few block prints a day, each one price: a
# flat bar or a repeated close is how they trade. Below $500,000 a day (the
# median over days with trading), or dorq's default 5,000 shares, those are
# reported at info; a flat bar on five times the median, and on at least the
# floors itself, stays at warn. On the shadow nights' 31 thin ETFs this leaves 7
# of 29 flat-bar reports at warn, two of them a 2x leveraged ETF trading $1.6M a
# day flat on 500,000 shares two days running.
[integrity]
flat_bar_min_median_dollar_volume = 500000

# A NAV-priced fund (fafnir's own rule: asset_type 'fund', or is_fund on anything
# that does not trade in sessions) strikes one price a day: a flat bar, on no
# volume. The volume checks and the flat-bar check have nothing to judge, and a
# money-market fund's constant $1.00 is a fact, not a stale feed.
[profiles.nav_funds]
match = { nav_priced = true }
ignore = ["DQ107", "DQ4", "DQ501", "DQ502"]
