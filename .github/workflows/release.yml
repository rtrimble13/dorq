name: release

# Publishes the version on main when it has no GitHub release yet: every version
# that reaches main is a release (ADR 0008). A pull request that changes the code
# raises the version (scripts/check_version.sh holds it to that), so its merge is
# the release. This builds and tests the merge commit, checks that the binary
# reports the version from a clean tree, then creates the tag vX.Y.Z at that commit
# and the GitHub release with the archives. A push that leaves the version as
# released finds nothing to do, in a few seconds. See CONTRIBUTING.md, "Versioning
# and releasing".
on:
  push:
    branches: [main]
  # By hand, from the Actions tab: after a transient failure.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One release at a time, and never cancelled half-way.
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
      tagged: ${{ steps.plan.outputs.tagged }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tags: whether this version is already released.
          fetch-depth: 0

      - name: Find the release that is due
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::A release publishes from main; this run is on ${GITHUB_REF}." >&2
            exit 1
          fi
          plan="$(scripts/release.sh plan)"
          version="$(sed -n 's/^version=//p' <<< "${plan}")"
          commit="$(sed -n 's/^commit=//p' <<< "${plan}")"
          tagged="$(sed -n 's/^tagged=//p' <<< "${plan}")"
          if out="$(gh release view "v${version}" --repo "${GITHUB_REPOSITORY}" --json tagName 2>&1)"; then
            echo "v${version} is published; nothing to release." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          elif ! grep -qi 'release not found' <<< "${out}"; then
            echo "::error::Could not ask GitHub whether v${version} is published: ${out}" >&2
            exit 1
          fi
          echo "Releasing v${version} from $(git log -1 --format='%h (%s)' "${commit}")." |
            tee -a "${GITHUB_STEP_SUMMARY}"
          {
            echo "version=${version}"
            echo "commit=${commit}"
            echo "tagged=${tagged}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: build (${{ matrix.platform }})
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # Built on Ubuntu 24.04: the binary needs glibc 2.39 or newer. libstdc++
          # and libgcc are linked in (DORQ_STATIC_RUNTIME in the release preset).
          - platform: linux-x86_64
            os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      VERSION: ${{ needs.plan.outputs.version }}
      # Report the version as the release, X.Y.Z: the tag does not exist yet when
      # this builds, and the step below checks that the binary says VERSION.
      # Elsewhere a build decides from git (X.Y.Z-dev off the tagged commit).
      DORQ_RELEASE: "ON"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure, build, test
        run: cmake --workflow --preset release

      # A tag is a promise that a commit is a version. This is where the promise is
      # checked, before the tag exists: the binary built from the commit must
      # report the version, from a clean tree.
      - name: The binary must report the release's version
        shell: bash
        run: |
          set -euo pipefail
          reported="$(build/release/src/dorq --version)"
          echo "release: v${VERSION}  binary: ${reported}"
          if [[ "${reported}" != "${VERSION}" ]]; then
            echo "::error::v${VERSION} is due, but the binary built from" \
                 "$(git rev-parse --short HEAD) reports ${reported}." >&2
            exit 1
          fi
          if build/release/src/dorq version | grep -q '+dirty'; then
            echo "::error::The release build recorded a dirty source tree." >&2
            exit 1
          fi
          build/release/src/dorq version

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="dorq-${VERSION}-${{ matrix.platform }}"
          cmake --install build/release --prefix "staging/${name}"
          # Owned by root in the archive, not by the runner's uid: tar run as root
          # keeps the recorded owner, and on a host that uid is whichever local
          # account has it, which could then replace the binary.
          tar --owner=0 --group=0 --numeric-owner -C staging -czf "${name}.tar.gz" "${name}"
          tar -tvzf "${name}.tar.gz"
          ldd "staging/${name}/bin/dorq"
          echo "ARCHIVE=${name}.tar.gz" >> "${GITHUB_ENV}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  publish:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      COMMIT: ${{ needs.plan.outputs.commit }}
      TAGGED: ${{ needs.plan.outputs.tagged }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz | tee SHA256SUMS

      # The release creates the tag vX.Y.Z at the commit built, as alpha-tango's
      # does. A tag already there (pushed by hand) is used as it is: plan took its
      # commit.
      - name: Create the tag and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          where=(--target "${COMMIT}")
          [[ "${TAGGED}" == "true" ]] && where=(--verify-tag)
          gh release create "v${VERSION}" dist/*.tar.gz dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "dorq ${VERSION}" \
            "${where[@]}" \
            --generate-notes
